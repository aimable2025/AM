name: Build Android APK (Ets AMANI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Compiler APK Android (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configuration de Java JDK 21 (requis par Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configuration du cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installation des dépendances NPM
        run: npm install

      - name: Compilation du projet Web (Vite)
        run: npm run build

      - name: Synchronisation Capacitor Android
        run: npx cap sync android

      - name: Compilation de l'APK Android (Installable directement)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Renommage de l'APK Ets AMANI
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ets-amani-android.apk

      - name: Publication de l'APK en téléchargement (Artifact GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: Ets-AMANI-APK
          path: android/app/build/outputs/apk/debug/ets-amani-android.apk
          if-no-files-found: error
          retention-days: 30
